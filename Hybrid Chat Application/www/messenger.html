<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeApRous Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-5xl bg-white shadow-2xl rounded-xl flex flex-col md:flex-row h-[90vh]">

        <!-- Cột Peer List -->
        <div class="w-full md:w-1/3 bg-gray-50 border-r border-gray-200 p-4 flex flex-col">

            <div class="flex justify-between items-center mb-3">
                <button id="logout-btn"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-sm mb-4 self-start">Logout</button>
                <h2 class="text-xl font-bold text-indigo-700">Danh sách Peer</h2>

                <button id="reloadPeer"
                    class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-indigo-700">
                    Tải lại
                </button>
            </div>
            <ul id="peer-list" class="space-y-2 flex-grow overflow-y-auto">
                <li class="text-gray-500">Đang tải...</li>
            </ul>
        </div>


        <!-- Cột Chat 
        <div class="w-full md:w-2/3 flex flex-col p-4">
            <h2 class="text-xl font-bold mb-3 text-gray-700">Chat với: <span id="current-peer">Chưa chọn</span></h2>

            <div id="chat-window" class="flex-grow p-3 bg-gray-100 rounded-lg overflow-y-auto mb-3">
                <!-- Tin nhắn hiển thị ở đây 
            </div>

            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="Nhập tin nhắn..."
                    class="flex-grow p-2 border rounded-lg">
                <button id="send-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Gửi</button>
            </div>
        </div>
    -->

        <div class="w-full md:w-2/3 flex flex-col p-4">

            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-bold text-gray-700">Chat với: <span id="current-peer">Chưa chọn</span></h2>
                <button id="broadcast-btn" title="Gửi tin cho mọi người"
                    class="bg-yellow-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-yellow-600">
                    📣 Broadcast
                </button>
            </div>

            <div id="chat-window" class="flex-grow p-3 bg-gray-100 rounded-lg overflow-y-auto mb-3">
            </div>

            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="Nhập tin nhắn..."
                    class="flex-grow p-2 border rounded-lg">
                <button id="send-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Gửi</button>
            </div>
        </div>

    </div>

    <script src="js/messenger.js"></script>
</body>

</html>
